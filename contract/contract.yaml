# The nopCommerce 3.90 contract (P5): what the legacy shop must do, and must never do, on
# the P4 traffic set. The rules are docs/P4-TRAFFIC-PLAN.md section 5 (R01-R46); each
# clause's `why` names the rules it states. A request a clause asserts a scenario-specific
# fact on carries probe=<name> in its query (plan section 1): the contract language scopes
# a clause by method, path and query, and every scenario uses the same URLs.
#
# Titles say exactly what the assertions check. Amounts are the shop's own, from the
# store configuration of plan section 2. Validate: sk validate contract/contract.yaml
apiVersion: secondkey/v1
kind: Contract
metadata:
  name: nopcommerce-390
  title: nopCommerce 3.90 sample shop - catalog, cart, discounts, taxes, shipping, checkout
  system: nopCommerce release-3.90 (12d1f01), IIS, .NET Framework 4.8, SQL Server 2022 Express
  revision: 1
  owners: [bench]

compare:
  headers: [content-type, location]
  html: extracts

extract:
  # --- Storefront pages ------------------------------------------------------------------
  - name: footer
    when: { method: GET, path: "^/(|notebooks|computers|desktops|search|lenovo-ideacentre-600-all-in-one-pc|apple-macbook-pro-13-inch|build-your-own-computer|25-virtual-gift-card)$" }
    from: html
    selector: ".footer-powered-by"
  - name: homeProducts
    when: { method: GET, path: "^/$" }
    from: html
    selector: ".home-page-product-grid .product-title a"
    all: true
  - name: listingProducts
    when: { method: GET, path: "^/(notebooks|search)$" }
    from: html
    selector: ".product-grid .product-title a"
    all: true
  - name: subcategories
    when: { method: GET, path: "^/computers$" }
    from: html
    selector: ".sub-category-grid .sub-category-item .title a"
    all: true
  - name: searchWarning
    when: { method: GET, path: "^/search$" }
    from: html
    selector: ".search-results .warning"
  - name: productName
    when: { method: GET, path: "^/(lenovo-ideacentre-600-all-in-one-pc|apple-macbook-pro-13-inch|build-your-own-computer)$" }
    from: html
    selector: ".product-essential .product-name h1"
  - name: productSku
    when: { method: GET, path: "^/(lenovo-ideacentre-600-all-in-one-pc|apple-macbook-pro-13-inch|build-your-own-computer)$" }
    from: html
    selector: ".product-essential .sku .value"
  - name: productPrice
    when: { method: GET, path: "^/(lenovo-ideacentre-600-all-in-one-pc|apple-macbook-pro-13-inch|build-your-own-computer)$" }
    from: html
    selector: ".product-essential .product-price span[itemprop=price]"
    attribute: content
    as: decimal
  - name: attributeOptions
    when: { method: GET, path: "^/build-your-own-computer$" }
    from: html
    selector: ".product-essential .attributes dd option, .product-essential .attributes dd li label"
    all: true

  # --- The cart page (GET, and the answer to every POST of its form) ---------------------
  - name: cartProducts
    when: { path: "^/cart$" }
    from: html
    selector: ".order-summary-content table.cart .product-name"
    all: true
  - name: cartQuantities
    when: { path: "^/cart$" }
    from: html
    selector: ".order-summary-content table.cart input.qty-input"
    attribute: value
    as: integer
    all: true
  - name: cartUnitPrices
    when: { path: "^/cart$" }
    from: html
    selector: ".order-summary-content table.cart .product-unit-price"
    as: decimal
    culture: en-US
    all: true
  - name: cartUnitPriceTexts
    when: { path: "^/cart$" }
    from: html
    selector: ".order-summary-content table.cart .product-unit-price"
    all: true
  - name: cartLineTotals
    when: { path: "^/cart$" }
    from: html
    selector: ".order-summary-content table.cart .product-subtotal"
    as: decimal
    culture: en-US
    all: true
  - name: cartSubtotal
    when: { path: "^/cart$" }
    from: html
    selector: "table.cart-total tr.order-subtotal .value-summary"
    as: decimal
    culture: en-US
  - name: cartSubtotalDiscount
    when: { path: "^/cart$" }
    from: html
    selector: "table.cart-total tr.order-subtotal-discount .value-summary"
  - name: cartShipping
    when: { path: "^/cart$" }
    from: html
    selector: "table.cart-total tr.shipping-cost .value-summary"
    as: decimal
    culture: en-US
  - name: cartTax
    when: { path: "^/cart$" }
    from: html
    selector: "table.cart-total tr.tax-value .value-summary"
    as: decimal
    culture: en-US
  - name: cartTotalDiscount
    when: { path: "^/cart$" }
    from: html
    selector: "table.cart-total tr.discount-total .value-summary"
  - name: cartTotal
    when: { path: "^/cart$" }
    from: html
    selector: "table.cart-total tr.order-total .value-summary"
    as: decimal
    culture: en-US
  - name: couponMessages
    when: { path: "^/cart$" }
    from: html
    selector: ".coupon-box .message-success, .coupon-box .message-failure"
    all: true
  - name: cartEmpty
    when: { path: "^/cart$" }
    from: html
    selector: ".order-summary-content .no-data"

  # --- Shipping --------------------------------------------------------------------------
  - name: shippingEstimates
    when: { method: POST, path: "^/cart/estimateshipping$" }
    from: html
    selector: ".shipping-results .option-name"
    all: true
  - name: checkoutGround
    when: { method: POST, path: "^/checkout/OpcSaveBilling/$", query: { probe: "^T24$" } }
    from: json
    selector: update_section.html
    regex: '>(Ground \(\$[0-9.,]+\))</label>'
  - name: checkoutSecondDayAir
    when: { method: POST, path: "^/checkout/OpcSaveBilling/$", query: { probe: "^T24$" } }
    from: json
    selector: update_section.html
    regex: '>(2nd Day Air \(\$[0-9.,]+\))</label>'
  - name: checkoutNextDayAir
    when: { method: POST, path: "^/checkout/OpcSaveBilling/$", query: { probe: "^T24$" } }
    from: json
    selector: update_section.html
    regex: '>(Next Day Air \(\$[0-9.,]+\))</label>'

  # --- Orders ----------------------------------------------------------------------------
  - name: placedOrderNumber
    when: { method: GET, path: "^/checkout/completed/$" }
    from: html
    selector: ".order-completed .order-number strong"
    regex: '([0-9]+)$'
    as: integer
  - name: orderNumber
    when: { method: GET, path: "^/orderdetails/[0-9]+$" }
    from: html
    selector: ".order-overview .order-number strong"
  - name: orderStatus
    when: { method: GET, path: "^/orderdetails/[0-9]+$" }
    from: html
    selector: ".order-overview .order-status"
  - name: orderTotals
    when: { method: GET, path: "^/orderdetails/[0-9]+$" }
    from: html
    selector: ".order-details-page .section.totals table.cart-total tr"
    all: true
  - name: historyOrders
    when: { method: GET, path: "^/order/history$" }
    from: html
    selector: ".order-list .order-item .title strong"
    all: true
  - name: registrationResult
    when: { method: GET, path: "^/registerresult/1$" }
    from: html
    selector: ".registration-result-page .result"

normalize:
  masks:
    patterns:
      # A PDF invoice carries its creation time and a random document id; the bytes of two
      # renderings never match. What the contract asserts about it is status and type.
      - { name: pdf-bytes, regex: '^JVBERi0[A-Za-z0-9+/=]*$', replacement: '<pdf>' }
      # The anti-forgery token MVC writes into a form is a fresh random value on every
      # rendering. The order summary is such a form, and the one-page checkout sends it
      # inside the JSON answer of its confirm step (update_section.html), which is compared
      # as it is; only the token's value is masked, the rest of the section still counts.
      - { name: anti-forgery-token, regex: '(?<=name="__RequestVerificationToken" type="hidden" value=")[^"]+', replacement: '<token>' }
      # A cart line's picture - its URL, alt text and link title - is cached for three
      # minutes by shopping-cart-item id (ShoppingCartModelFactory.PrepareCartItemPictureModel).
      # Every scenario starts from the same snapshot, so every scenario's first cart line
      # has the same id, and for up to three minutes a line shows the picture of whatever
      # product last had that id - on either side. The mini cart in the add-to-cart answer
      # and the confirm step's order summary are JSON, compared as they are, so the three
      # values are masked there; the line's product name, price and quantity still count.
      # Pages are compared through their extracts, and no extractor reads a picture.
      - { name: cart-line-picture, regex: '(?<=\b(?:alt="Picture of |title="Show details for ))[^"]*|(?<=\bsrc=")[^"]*/content/images/thumbs/[^"]*', replacement: '<cached picture>' }

clauses:
  # === Catalog and search ================================================================
  - id: STOREFRONT-ANSWERS-WITH-FOOTER
    kind: must
    title: The home, category, search and product pages the traffic opens answer 200 and show "Powered by nopCommerce"
    why: R01. A storefront page that fails, or loses its layout, loses the visit; the footer is the layout's last element, so its presence says the page rendered to the end.
    when: { method: GET, path: "^/(|notebooks|computers|desktops|search|lenovo-ideacentre-600-all-in-one-pc|apple-macbook-pro-13-inch|build-your-own-computer|25-virtual-gift-card)$" }
    assert:
      - { select: response.status, op: equals, value: 200 }
      - { select: extract.footer, op: equals, value: "Powered by nopCommerce" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: HOME-LISTS-THE-FOUR-HOME-PAGE-PRODUCTS
    kind: must
    title: The home page lists exactly four products - Build your own computer, Apple MacBook Pro 13-inch, HTC One M8 Android L 5.0 Lollipop and $25 Virtual Gift Card, the four the sample data flags "show on home page"
    why: R02. The home page is the shop window; a product missing from it, or one that should not be there, changes what customers buy.
    when: { method: GET, path: "^/$" }
    assert:
      - { select: extract.homeProducts, op: countEquals, value: 4 }
      - { select: extract.homeProducts, op: contains, value: "Build your own computer" }
      - { select: extract.homeProducts, op: contains, value: "Apple MacBook Pro 13-inch" }
      - { select: extract.homeProducts, op: contains, value: "HTC One M8 Android L 5.0 Lollipop" }
      - { select: extract.homeProducts, op: contains, value: "$25 Virtual Gift Card" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: COMPUTERS-LISTS-ITS-SUBCATEGORIES
    kind: must
    title: The Computers category lists its three subcategories Desktops, Notebooks and Software
    why: R01, plan T03. The category tree is how customers find products; a lost subcategory hides everything in it.
    when: { method: GET, path: "^/computers$" }
    assert:
      - { select: extract.subcategories, op: countEquals, value: 3 }
      - { select: extract.subcategories, op: contains, value: "Desktops" }
      - { select: extract.subcategories, op: contains, value: "Notebooks" }
      - { select: extract.subcategories, op: contains, value: "Software" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: NOTEBOOKS-BY-PRICE-ASCENDING
    kind: must
    title: Notebooks sorted by price (orderby=10) list HP Spectre, Lenovo Thinkpad X1, Asus N551JK, Samsung Series 9, Apple MacBook Pro - $1,350 to $1,800
    why: R03. "Price low to high" that is not in price order misleads every customer who uses it.
    when: { method: GET, path: "^/notebooks$", query: { orderby: "^10$" } }
    assert:
      - { select: extract.listingProducts, op: equals, value: ["HP Spectre XT Pro UltraBook", "Lenovo Thinkpad X1 Carbon Laptop", "Asus N551JK-XO076H Laptop", "Samsung Series 9 NP900X4C Premium Ultrabook", "Apple MacBook Pro 13-inch"] }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: NOTEBOOKS-BY-NAME
    kind: must
    title: Notebooks sorted by name (orderby=5) list Apple, Asus, HP Spectre, Lenovo, Samsung in that order
    why: R03. Name order comes from the database collation today; a migration that sorts in memory can change it.
    when: { method: GET, path: "^/notebooks$", query: { orderby: "^5$" } }
    assert:
      - { select: extract.listingProducts, op: equals, value: ["Apple MacBook Pro 13-inch", "Asus N551JK-XO076H Laptop", "HP Spectre XT Pro UltraBook", "Lenovo Thinkpad X1 Carbon Laptop", "Samsung Series 9 NP900X4C Premium Ultrabook"] }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: NOTEBOOKS-PAGE-TWO-OF-THREE-PER-PAGE
    kind: must
    title: Page 2 of the notebooks at 3 per page lists Lenovo Thinkpad X1 Carbon Laptop and Samsung Series 9 NP900X4C Premium Ultrabook
    why: R04. Five published notebooks at three per page leave the last two for page two; paging that loses or repeats products hides them.
    when: { method: GET, path: "^/notebooks$", query: { pagesize: "^3$", pagenumber: "^2$" } }
    assert:
      - { select: extract.listingProducts, op: equals, value: ["Lenovo Thinkpad X1 Carbon Laptop", "Samsung Series 9 NP900X4C Premium Ultrabook"] }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: UNPUBLISHED-NEVER-LISTED
    kind: never
    title: The unpublished HP Envy 6-1180ca is never among the products a notebooks listing or a search lists
    why: R05. An unpublished product can be withdrawn for a reason - a recall, a wrong price; listing it sells what the shop took down.
    when: { method: GET, path: "^/(notebooks|search)$" }
    assert:
      - { select: extract.listingProducts, op: contains, value: "HP Envy 6-1180ca 15.6-Inch Sleekbook" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: UNPUBLISHED-PAGE-NEVER-SERVED
    kind: never
    title: The unpublished HP Envy 6-1180ca's product page is never answered 200
    why: R05. With unpublished product pages closed (plan section 2), serving the page lets a customer buy a withdrawn product from an old link.
    when: { method: GET, path: "^/hp-envy-6-1180ca-156-inch-sleekbook$" }
    assert:
      - { select: response.status, op: equals, value: 200 }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: UNPUBLISHED-PAGE-NOT-FOUND
    kind: must
    title: The unpublished HP Envy 6-1180ca's product page answers 404
    why: R05's positive twin - the never clause needs the request answered, and the answer is "not found", as for a product that does not exist.
    when: { method: GET, path: "^/hp-envy-6-1180ca-156-inch-sleekbook$" }
    assert:
      - { select: response.status, op: equals, value: 404 }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: LENOVO-PAGE-NAME-SKU-PRICE
    kind: must
    title: The Lenovo IdeaCentre 600 page shows its name, SKU LE_IC_600 and price 500.00
    why: R06. The product page is where the price is promised; a wrong name, SKU or price is a mis-sale.
    when: { method: GET, path: "^/lenovo-ideacentre-600-all-in-one-pc$" }
    assert:
      - { select: extract.productName, op: equals, value: "Lenovo IdeaCentre 600 All-in-One PC" }
      - { select: extract.productSku, op: equals, value: "LE_IC_600" }
      - { select: extract.productPrice, op: equals, value: 500 }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: MACBOOK-PAGE-NAME-SKU-PRICE
    kind: must
    title: The Apple MacBook Pro 13-inch page shows its name, SKU AP_MBP_13 and price 1800.00
    why: R06. The product page is where the price is promised; a wrong name, SKU or price is a mis-sale.
    when: { method: GET, path: "^/apple-macbook-pro-13-inch$" }
    assert:
      - { select: extract.productName, op: equals, value: "Apple MacBook Pro 13-inch" }
      - { select: extract.productSku, op: equals, value: "AP_MBP_13" }
      - { select: extract.productPrice, op: equals, value: 1800 }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: COMPUTER-PAGE-ATTRIBUTE-ADJUSTMENTS
    kind: must
    title: The Build your own computer page shows price 1200.00 and the options "2.5 GHz Intel Pentium Dual-Core E2200 [+$15.00]" and "400 GB [+$100.00]"
    why: R06, plan T04. Attribute price adjustments shown on the page are what the customer agrees to pay for each option.
    when: { method: GET, path: "^/build-your-own-computer$" }
    assert:
      - { select: extract.productPrice, op: equals, value: 1200 }
      - { select: extract.attributeOptions, op: contains, value: "2.5 GHz Intel Pentium Dual-Core E2200 [+$15.00]" }
      - { select: extract.attributeOptions, op: contains, value: "400 GB [+$100.00]" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: SEARCH-FINDS-MACBOOK-BY-NAME-CASE-AND-SKU
    kind: must
    title: Searching apple, APPLE, " apple " or the SKU AP_MBP_13 lists Apple MacBook Pro 13-inch
    why: R07. Search that depends on letter case, stray spaces or ignores the SKU loses the customers who type it that way.
    when: { method: GET, path: "^/search$", query: { q: "^(\\s|%20)*(apple|APPLE|AP_MBP_13)(\\s|%20)*$" } }
    assert:
      - { select: extract.listingProducts, op: contains, value: "Apple MacBook Pro 13-inch" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: SEARCH-TERM-MINIMUM-LENGTH
    kind: must
    title: Searching "ap" answers "Search term minimum length is 3 characters" and lists no product
    why: R08. The minimum length protects the database from two-letter scans and tells the customer why nothing was found.
    when: { method: GET, path: "^/search$", query: { q: "^ap$" } }
    assert:
      - { select: extract.searchWarning, op: equals, value: "Search term minimum length is 3 characters" }
      - { select: extract.listingProducts, op: countEquals, value: 0 }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  # === Cart ==============================================================================
  - id: LISTING-ADD-TO-CART-SUCCEEDS
    kind: must
    title: Every add-to-cart from a listing button answers "success":true
    why: R09. The listing's add-to-cart button is the shortest path to a sale; a refusal there is a lost order.
    when: { method: POST, path: "^/addproducttocart/catalog/" }
    assert:
      - { select: response.body.json.success, op: equals, value: true }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: T07-CART-HOLDS-ONE-LENOVO
    kind: must
    title: After a refused add of 5 more, the T07 cart still holds exactly one line, one Lenovo IdeaCentre 600
    why: R09, R10. A refused add must leave the cart as it was.
    when: { method: GET, path: "^/cart$", query: { probe: "^T07$" } }
    assert:
      - { select: extract.cartProducts, op: equals, value: ["Lenovo IdeaCentre 600 All-in-One PC"] }
      - { select: extract.cartQuantities, op: equals, value: [1] }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: QUANTITY-ABOVE-STOCK-REFUSED
    kind: must
    title: Adding 5 Lenovos to a cart holding 1, with 3 in stock, answers "success":false with "Your quantity exceeds stock on hand. The maximum quantity that can be added is 3."
    why: R10. Without backorders the shop must not sell stock it does not have.
    when: { method: POST, path: "^/addproducttocart/details/3/1$", query: { probe: "^T07$" } }
    assert:
      - { select: response.body.json.success, op: equals, value: false }
      - { select: response.body.json.message, op: contains, value: "Your quantity exceeds stock on hand. The maximum quantity that can be added is 3." }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: QUANTITY-BELOW-MINIMUM-REFUSED
    kind: must
    title: Adding 1 MacBook answers "success":false with "The minimum quantity allowed for purchase is 2."
    why: R11. The minimum order quantity is a commercial term of the product; selling below it breaks it.
    when: { method: POST, path: "^/addproducttocart/details/4/1$", query: { probe: "^T08$" } }
    assert:
      - { select: response.body.json.success, op: equals, value: false }
      - { select: response.body.json.message, op: contains, value: "The minimum quantity allowed for purchase is 2." }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: REQUIRED-ATTRIBUTE-REFUSED
    kind: must
    title: Adding Build your own computer without an HDD answers "success":false with "Please select HDD"
    why: R12. A configurable product without a required option cannot be built or priced.
    when: { method: POST, path: "^/addproducttocart/details/1/1$", query: { probe: "^T09$" } }
    assert:
      - { select: response.body.json.success, op: equals, value: false }
      - { select: response.body.json.message, op: contains, value: "Please select HDD" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: T09-ATTRIBUTES-PRICED-INTO-UNIT-PRICE
    kind: must
    title: The T09 cart prices the configured computer at 1435.00 (1200 + 15 + 20 + 100 + 50 + 50), one line, subtotal 1435.00
    why: R13. Attribute adjustments must reach the unit price the customer pays.
    when: { method: GET, path: "^/cart$", query: { probe: "^T09$" } }
    assert:
      - { select: extract.cartUnitPrices, op: equals, value: [1435] }
      - { select: extract.cartLineTotals, op: equals, value: [1435] }
      - { select: extract.cartSubtotal, op: equals, value: 1435 }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: T10-QUANTITY-UPDATE-REPRICES
    kind: must
    title: Setting the Lenovo line to 3 shows quantities 3 and 1, line totals 1500.00 and 24.00 and subtotal 1524.00
    why: R13. A line total is unit price times quantity and the subtotal their sum; anything else charges the wrong amount.
    when: { method: POST, path: "^/cart$", query: { probe: "^T10-quantity$" } }
    assert:
      - { select: extract.cartQuantities, op: equals, value: [3, 1] }
      - { select: extract.cartLineTotals, op: equals, value: [1500, 24] }
      - { select: extract.cartSubtotal, op: equals, value: 1524 }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: T10-REMOVE-CHECKBOX-DELETES-LINE
    kind: must
    title: Ticking "remove" on the book leaves the cart with the Lenovo line only
    why: R14. A customer who removes an item must not be charged for it.
    when: { method: POST, path: "^/cart$", query: { probe: "^T10-remove$" } }
    assert:
      - { select: extract.cartProducts, op: equals, value: ["Lenovo IdeaCentre 600 All-in-One PC"] }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: T10-QUANTITY-ZERO-EMPTIES-CART
    kind: must
    title: Setting the last line to quantity 0 answers "Your Shopping Cart is empty!" with no line
    why: R14. Quantity 0 removes the line; keeping it would put a zero-quantity item into the order.
    when: { method: POST, path: "^/cart$", query: { probe: "^T10-zero$" } }
    assert:
      - { select: extract.cartEmpty, op: equals, value: "Your Shopping Cart is empty!" }
      - { select: extract.cartProducts, op: countEquals, value: 0 }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: CART-UNIT-PRICES-WRITTEN-IN-USD
    kind: must
    title: Every unit price on a cart page is written as $#,##0.00
    why: R46. Prices are shown in US dollars with the en-US pattern; another pattern is another price to a customer.
    when: { method: GET, path: "^/cart$", query: { probe: "^(T07|T09)$" } }
    assert:
      - { select: "extract.cartUnitPriceTexts[*]", op: matches, value: "^\\$[0-9]{1,3}(,[0-9]{3})*\\.[0-9]{2}$" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  # === Discounts =========================================================================
  - id: SAVE10-TAKES-10-PERCENT-OF-SUBTOTAL
    kind: must
    title: SAVE10 on the $1,000.00 cart answers "The coupon code was applied" and shows the subtotal discount as ($100.00)
    why: R15, R27. A percentage coupon must take exactly its percentage; how a discount is written - here in parentheses - is what the customer reads as a deduction.
    when: { method: POST, path: "^/cart$", query: { probe: "^T11$" } }
