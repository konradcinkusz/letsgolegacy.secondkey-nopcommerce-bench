      - { select: extract.historyOrders, op: equals, value: ["Order Number: 1"] }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: OWN-ORDER-DETAILS-SHOWN
    kind: must
    title: 'The sample customer''s own order 1 answers 200 with "Order #1"'
    why: R43. A customer can always see an order of their own.
    when: { method: GET, path: "^/orderdetails/1$" }
    assert:
      - { select: response.status, op: equals, value: 200 }
      - { select: extract.orderNumber, op: equals, value: "Order #1" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: OWN-ORDER-PDF-INVOICE
    kind: must
    title: The PDF invoice of the sample customer's own order 1 answers 200 as application/pdf
    why: R43. The invoice is a document the customer is owed.
    when: { method: GET, path: "^/orderdetails/pdf/1$" }
    assert:
      - { select: response.status, op: equals, value: 200 }
      - { select: "response.headers.content-type[0]", op: matches, value: "^application/pdf" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: OTHERS-ORDER-NEVER-SHOWN
    kind: never
    title: Someone else's order 2 - its details, print view or PDF - is never answered 200, to a guest or to another customer
    why: R44. Another customer's order holds their name, address and what they bought.
    when: { method: GET, path: "^/orderdetails(/print|/pdf)?/2$" }
    assert:
      - { select: response.status, op: equals, value: 200 }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: OTHERS-ORDER-NEVER-NAMES-ITS-OWNER
    kind: never
    title: No answer to a request for someone else's order 2 ever contains its owner's name, Arthur
    why: R44. Even a refusal must not leak who ordered what.
    when: { method: GET, path: "^/orderdetails(/print|/pdf)?/2$" }
    assert:
      - { select: response.body.text, op: contains, value: "Arthur" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: OTHERS-ORDER-SENDS-TO-LOGIN
    kind: must
    title: The requests of T30A and T30B - someone else's order 2 (details, print view, PDF, reorder) and a guest's order history - are redirected (302) to /login?ReturnUrl=...
    why: The positive twin of R44 and R45's never clauses - they need the requests answered, and the answer is a sign-in.
    when: { method: GET, path: "^/(orderdetails(/print|/pdf)?/2|reorder/2|order/history)$", query: { probe: "^T30[AB]$" } }
    assert:
      - { select: response.status, op: equals, value: 302 }
      - { select: "response.headers.location[0]", op: matches, value: "^/login\\?ReturnUrl=" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: GUEST-NEVER-GETS-ORDER-HISTORY
    kind: never
    title: A guest's request for /order/history is never answered 200
    why: R45. A guest has no account, so no history; answering it would mean showing someone's.
    when: { method: GET, path: "^/order/history$", query: { probe: "^T30A$" } }
    assert:
      - { select: response.status, op: equals, value: 200 }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: NOBODY-REORDERS-OTHERS-ORDER
    kind: never
    title: A guest's reorder of someone else's order 2 never leads to the cart
    why: R45. Reordering another customer's order copies their purchase into a stranger's cart.
    when: { method: GET, path: "^/reorder/2$", query: { probe: "^T30A$" } }
    assert:
      - { select: "response.headers.location[0]", op: matches, value: "^/cart" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  # === Customers =========================================================================
  - id: SIGN-IN-RETURNS-HOME
    kind: must
    title: Signing in with valid credentials answers 302 to /
    why: Plan T18, T19, T29. A sign-in that does not complete locks the customer out of their account and their prices.
    when: { method: POST, path: "^/login$" }
    assert:
      - { select: response.status, op: equals, value: 302 }
      - { select: "response.headers.location[0]", op: equals, value: "/" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  - id: REGISTRATION-COMPLETES
    kind: must
    title: Registering R1 answers "Your registration completed"
    why: Plan T28. Registration is how a guest becomes a customer with an order history.
    when: { method: GET, path: "^/registerresult/1$" }
    assert:
      - { select: extract.registrationResult, op: equals, value: "Your registration completed" }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }

  # === Every request =====================================================================
  - id: NEVER-A-SERVER-ERROR
    kind: never
    title: No request of the traffic set is ever answered with a server error (5xx)
    why: A server error loses whatever the customer was doing - a sale, a payment, an account - and says nothing they can act on.
    assert:
      - { select: response.status, op: gte, value: 500 }
    provenance: { origin: designed, status: accepted, author: bench, date: 2026-09-26 }
